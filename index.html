
<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Team Leader | الركاز</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1DB954;
            --primary-light: #D1FAE5;
            --bg-obsidian: #040907;
            --card-glass: rgba(10, 20, 15, 0.75);
            --emerald-glow: rgba(29, 185, 84, 0.2);
        }
        
        html, body, #root {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-obsidian);
            color: var(--primary-light);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
        }

        body {
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(29, 185, 84, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(209, 250, 229, 0.05) 0%, transparent 50%);
        }

        .page-enter {
            animation: fadeInScale 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .bento-card {
            background: var(--card-glass);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(209, 250, 229, 0.08);
            border-radius: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bento-card:hover {
            border-color: rgba(29, 185, 84, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--emerald-glow);
            transform: translateY(-4px);
        }

        .emerald-glow {
            box-shadow: 0 0 30px var(--emerald-glow);
        }

        .text-shiny {
            background: linear-gradient(135deg, #fff 0%, #D1FAE5 50%, #1DB954 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(29, 185, 84, 0.2); border-radius: 10px; }

        .img-container {
            background-color: #0a1410;
            position: relative;
            overflow: hidden;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .logo-container img {
            object-fit: contain;
        }
    </style>
